<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Tower of Happiness</title>
        <link rel="stylesheet" href="style.css?v=2">
    </head>
    <body>
        <canvas id="canvas"></canvas>
        <canvas id="hudCanvas" style="position: absolute; left: 0; top: 0; z-index: 2; pointer-events: none;"></canvas>

        <div id="roomMenu">
            <div class="roomMenuTitle">Tower of Happiness</div>
            <div id="roomList">Loading rooms…</div>
            <div id="createRoomRow">
                <input id="createRoomInput" type="text" maxlength="30" placeholder="New room name (optional)" />
                <button id="createRoomBtn">Create Room</button>
            </div>
            <button id="practiceToggleBtn">Practice — pick a tower</button>
            <div id="practicePicker" class="hidden"></div>
            <div id="joinPendingNote" class="hidden">Waiting for the host to approve your join…</div>
            <button id="shopToggleBtn">Shop — <span id="shopCoinsInline">0</span> coins</button>
            <div id="shopPanel" class="hidden"></div>
        </div>

        <div id="lobbyPanel" class="hidden">
            <div class="lobbyTitle">Waiting for players</div>
            <div id="lobbyPlayerList"></div>
            <button id="startRoundBtn">Start</button>
            <div id="hostTowerRow" class="hidden">
                <span>Tower:</span>
                <select id="hostTowerSelect"></select>
            </div>
        </div>

        <div id="coinCounter" class="hidden"><span id="coinCount">0</span> coins</div>

        <div id="joinRequestsPanel" class="hidden"></div>

        <div id="towerChoiceModal" class="hidden">
            <div class="towerChoiceTitle">You won! Pick the next tower</div>
            <div id="towerChoiceOptions"></div>
        </div>
        <div id="towerChoiceWaitingNote" class="hidden"></div>

        <div id="chatLog"></div>

        <div id="adminConsole" class="hidden">
            <input id="adminConsoleInput" type="text" autocomplete="off" placeholder="chat" />
        </div>

        <div id="ghostHint" class="hidden">GHOST — fly around and wait for the lava to reset</div>
        <div id="lavaOverlay" class="hidden"></div>
        <div id="roundTimer" class="hidden">5:00</div>
        <div id="roundBanner" class="hidden"></div>

        <div id="adminPanel" class="hidden">
            <div class="adminPanelTitle">Admin <button id="adminPanelClose" title="Close">&times;</button></div>
            <label><input type="checkbox" id="adminFly" /> Fly / noclip</label>
            <label>Speed <input type="number" id="adminSpeed" step="0.1" min="0.1" max="10" value="1" /></label>
            <label>Gravity <input type="number" id="adminGravity" step="0.1" min="0" max="5" value="1" /></label>
            <label>Jump <input type="number" id="adminJump" step="0.1" min="0.1" max="10" value="1" /></label>
            <div class="adminPanelButtons">
                <button id="adminTpTop">Teleport top</button>
                <button id="adminTpSpawn">Teleport spawn</button>
            </div>
        </div>

        <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
        <script src="autoplay.js?v=2"></script>
        <script src="script.js?v=24"></script>
    </body>
</html>
